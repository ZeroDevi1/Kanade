[project]
name = "kanade-yingmusic"
version = "0.1.0"
description = "Offline subprocess adapter for YingMusic-Singer-Plus"
requires-python = ">=3.10"
dependencies = ["kanade-engine-sdk"]

[tool.uv.sources]
kanade-engine-sdk = { path = "../sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kanade_yingmusic"]
