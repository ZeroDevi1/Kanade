[project]
name = "kanade-soulx"
version = "0.1.0"
description = "Offline isolated SoulX-Singer SVS adapter"
requires-python = ">=3.10"
dependencies = ["kanade-engine-sdk"]
[tool.uv.sources]
kanade-engine-sdk = { path = "../sdk", editable = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/kanade_soulx"]
