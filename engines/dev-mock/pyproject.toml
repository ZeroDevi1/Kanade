[project]
name = "kanade-dev-mock"
version = "0.1.0"
description = "开发用模拟引擎：不依赖模型与 GPU，生成测试音频并模拟进度，用于在 macOS 上跑通界面流程"
requires-python = ">=3.10"
dependencies = ["kanade-engine-sdk"]

[tool.uv.sources]
# editable：SDK 版本号不变时 uv sync 不会重装非 editable 的 path 依赖，改为直接引用释放出的源码。
kanade-engine-sdk = { path = "../sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kanade_dev_mock"]
