[project]
name = "kanade-voxcpm"
version = "0.1.0"
description = "Kanade 的 VoxCPM 推理引擎（Cantus）：音色克隆、风格控制、音色设计"
requires-python = "==3.12.*"
dependencies = [
    "kanade-engine-sdk",
    # voxcpm 2.0.3 要求 torch >= 2.5、transformers >= 4.36.2；与 Qwen3-TTS / IndexTTS 引擎统一用 torch 2.8.0
    # （cu128 构建支持 RTX 20 至 RTX 50）与 transformers 4.57.3。
    "voxcpm==2.0.3",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.3",
    "numpy",
    "soundfile",
]

[tool.uv]
# 只为实际发布的两个平台解析：Windows x64（CUDA 推理）与 macOS arm64（界面开发与 CPU / MPS 冒烟测试）。
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# voxcpm 无条件依赖的这些包只有 Web 演示（gradio、spaces）、训练脚本（datasets、argbind 之外的 funasr 评测）与
# 参考音频降噪（funasr / modelscope 的 ZipEnhancer，引擎不启用）使用，推理路径不导入；用永不成立的标记排除，
# 省去约 1 GB 依赖。torchcodec 在 Windows 上需要系统安装 FFmpeg 动态库，VoxCPM2 推理用 librosa 读音频，也排除。
override-dependencies = [
    "gradio; sys_platform == 'never'",
    "spaces; sys_platform == 'never'",
    "funasr; sys_platform == 'never'",
    "datasets; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
]

[tool.uv.sources]
# editable：SDK 版本号不变时 uv sync 不会重装非 editable 的 path 依赖，改为直接引用释放出的源码。
kanade-engine-sdk = { path = "../sdk", editable = true }
# Windows 用 PyTorch 官方 CUDA 12.8 构建（要求驱动 570 及以上）；macOS 用 PyPI 的 CPU/MPS 构建。
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kanade_voxcpm"]
